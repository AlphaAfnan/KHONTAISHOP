<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KhontaiShop | ร้านค้าไอเทมเกม</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;700&family=Prompt:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0e14;--bg2:#10151f;--card:#151b26;--line:#252d3d;--red:#ff4655;--red2:#b91c1c;--txt:#e8ebf2;--mut:#8b95aa;--ok:#3ddc97;--warn:#ffb020}
*{box-sizing:border-box;margin:0}
body{font-family:Prompt,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;line-height:1.5}
h1,h2,h3,h4,.logo,.price{font-family:Kanit,sans-serif}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
header{position:sticky;top:0;z-index:10;background:rgba(11,14,20,.95);border-bottom:2px solid var(--red);backdrop-filter:blur(6px)}
.bar{max-width:1200px;margin:auto;padding:12px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{font-size:22px;font-weight:700;letter-spacing:.5px;margin-right:auto}
.logo b{color:var(--red)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:8px 14px;border-radius:6px;color:var(--mut);cursor:pointer}
nav a:hover,nav a.on{color:#fff;background:var(--card)}
.wrap{max-width:1200px;margin:auto;padding:24px 16px 60px}
.btn{display:inline-block;border:1px solid var(--line);background:var(--card);color:var(--txt);padding:9px 18px;border-radius:6px;cursor:pointer;font:inherit}
.btn:hover{border-color:var(--red)}
.btn.pri{background:linear-gradient(135deg,#ff4655,#e63946 50%,#b91c1c);border:0;color:#fff;font-weight:500}
.btn.pri:hover{box-shadow:0 6px 20px rgba(255,70,85,.35)}
.btn.sm{padding:5px 12px;font-size:14px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px;margin-bottom:20px}
/* slider */
.slider{position:relative;height:clamp(180px,30vw,400px);border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 6%;opacity:0;transition:opacity .6s;cursor:pointer}
.slide.on{opacity:1}
.slide h2{font-size:clamp(22px,4vw,44px);max-width:720px;line-height:1.15}
.slide p{color:#ffd5d9;max-width:560px;margin-top:10px}
.s1{background:linear-gradient(120deg,#2a0a10,#7a1220 55%,#ff4655)}
.s2{background:linear-gradient(120deg,#0b0e14,#3a0d16 50%,#b91c1c)}
.dots{position:absolute;bottom:12px;right:16px;display:flex;gap:6px}
.dots i{width:22px;height:4px;background:#fff5;cursor:pointer}
.dots i.on{background:var(--red)}
/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:20px 0 34px}
.stat{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--red);padding:16px 20px;border-radius:8px}
.stat strong{font:700 30px Kanit;display:block}
.stat span{color:var(--mut);font-size:14px}
.sec{display:flex;justify-content:space-between;align-items:center;margin:30px 0 14px}
.sec h3{font-size:22px;border-left:4px solid var(--red);padding-left:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.cat{display:flex;gap:12px;align-items:center;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:8px;cursor:pointer}
.cat:hover,.prod:hover{border-color:var(--red);box-shadow:0 10px 30px rgba(255,70,85,.2)}
.cat .ico{width:46px;height:46px;border-radius:8px;background:#2a1118;display:grid;place-items:center;font-size:22px}
.cat small{color:var(--mut)}
.prod{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.pimg{height:130px;background:linear-gradient(135deg,#1c2433,#3a0d16);display:grid;place-items:center;font-size:44px;position:relative}
.tag{position:absolute;top:8px;left:8px;background:#000a;padding:2px 9px;border-radius:20px;font-size:12px}
.stk{position:absolute;bottom:8px;right:8px;padding:2px 9px;border-radius:20px;font-size:12px;background:var(--ok);color:#04251a}
.stk.out{background:#444;color:#ccc}
.pbody{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.pbody h4{font-size:16px}
.pbody p{color:var(--mut);font-size:13px;flex:1}
.pf{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.price{font-size:20px;color:var(--red);font-weight:700}
/* forms */
input,select{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--txt);padding:11px 13px;border-radius:6px;font:inherit}
input:focus,select:focus{border-color:var(--red);outline:0}
label{display:block;margin:12px 0 5px;font-weight:500}
.narrow{max-width:440px;margin:30px auto}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:160px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.pill{padding:6px 14px;border-radius:20px;border:1px solid var(--line);cursor:pointer;font-size:14px;background:var(--bg2)}
.pill.on{background:var(--red);border-color:var(--red)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:14px}
th{color:var(--mut);font-weight:500}
.tw{overflow-x:auto}
code{background:var(--bg2);padding:2px 7px;border-radius:4px;color:#ffb3ba}
.ok{color:var(--ok)}.bad{color:var(--red)}.wa{color:var(--warn)}
.note{background:var(--bg2);border:1px dashed var(--line);padding:10px 14px;border-radius:6px;color:var(--mut);font-size:14px;margin:14px 0}
.empty{text-align:center;padding:40px;color:var(--mut)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#121721;border:1px solid var(--red);box-shadow:0 0 20px rgba(255,70,85,.35);padding:12px 22px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}
#toast.show{opacity:1}
.modal{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:20;padding:16px}
.modal.show{display:grid}
.modal .panel{max-width:420px;width:100%;border-color:var(--red);margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="bar">
  <a class="logo" href="#home">KHONTAI<b>SHOP</b></a>
  <nav id="nav"></nav>
</div></header>
<main class="wrap" id="app"></main>
<div id="toast"></div>
<div class="modal" id="modal"><div class="panel" id="mbox"></div></div>

<script>
/* ===== ข้อมูลตัวอย่าง (เชื่อมกับ API/ฐานข้อมูลจริงได้ภายหลัง) ===== */
const CATS=[
 {id:1,name:'โค้ดเติมเกม',icon:'🎮',desc:'โค้ดเติมเงินเกมยอดนิยม ส่งอัตโนมัติ'},
 {id:2,name:'บัตรเติมเงิน',icon:'💳',desc:'บัตรเติมเงินแพลตฟอร์มเกม'},
 {id:3,name:'ไอดีเกม',icon:'🧑‍🎮',desc:'ไอดีเกมพร้อมเล่น'},
 {id:4,name:'ไอเทมในเกม',icon:'🗡️',desc:'ไอเทมและสกินสุดพิเศษ'}];
const PRODS=[
 {id:1,cat:1,name:'Valorant Points 475 VP',price:149,stock:25,pop:90,desc:'โค้ดแท้ 100% รับทันทีหลังชำระเงิน',e:'🔺'},
 {id:2,cat:1,name:'Valorant Points 1,000 VP',price:299,stock:12,pop:80,desc:'โค้ดแท้ 100% รับทันทีหลังชำระเงิน',e:'🔺'},
 {id:3,cat:2,name:'Steam Wallet 100 บาท',price:105,stock:40,pop:95,desc:'บัตรเติมเงิน Steam',e:'💠'},
 {id:4,cat:2,name:'Garena Shells 200',price:200,stock:0,pop:60,desc:'บัตรเติมเงิน Garena',e:'🐚'},
 {id:5,cat:3,name:'ไอดี ROV แรงค์ Diamond',price:350,stock:3,pop:50,desc:'ไอดีพร้อมเล่น เปลี่ยนรหัสได้',e:'👑'},
 {id:6,cat:4,name:'สกินปืน Prime Vandal',price:450,stock:6,pop:70,desc:'ไอเทมสกินพรีเมียม',e:'🔫'},
 {id:7,cat:1,name:'Roblox Robux 400',price:179,stock:18,pop:85,desc:'โค้ดเติม Robux',e:'🧱'},
 {id:8,cat:2,name:'Google Play 300 บาท',price:310,stock:9,pop:55,desc:'บัตรเติมเงิน Google Play',e:'▶️'}];
const SLIDES=[
 {c:'s1',t:'KHONTAISHOP – GAME ITEM MARKETPLACE',s:'โค้ดเกม บัตรเติมเงิน และไอเทมเกมออนไลน์ ส่งอัตโนมัติตลอด 24 ชม.',go:'categories'},
 {c:'s2',t:'จัดส่งอัตโนมัติ รวดเร็ว ปลอดภัย',s:'เติมเครดิตผ่านซองของขวัญ TrueMoney Wallet รับโค้ดทันที',go:'topup'}];
const PHONE='0901234567';

/* ===== สถานะ (เก็บใน localStorage ถ้าใช้ได้) ===== */
let S={users:[{username:'admin',email:'admin@khontaishop.com',password:'admin123',credit:5000},
 {username:'user',email:'user@khontaishop.com',password:'user123',credit:480}],
 me:null,orders:[],topups:[],sold:0,stock:{}};
try{const x=localStorage.getItem('kts');if(x)S=JSON.parse(x)}catch(e){}
const save=()=>{try{localStorage.setItem('kts',JSON.stringify(S))}catch(e){}};
const me=()=>S.users.find(u=>u.username===S.me);
const stock=p=>S.stock[p.id]??p.stock;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const thDate=d=>new Date(d).toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'});
const $=s=>document.querySelector(s);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2600)}
function copy(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('คัดลอกแล้ว')).catch(()=>toast('คัดลอกไม่สำเร็จ'))}

/* ===== ซื้อสินค้า ===== */
function buy(id){
 const u=me();if(!u){toast('กรุณาเข้าสู่ระบบก่อนซื้อสินค้า');location.hash='login';return}
 const p=PRODS.find(x=>x.id===id);
 $('#mbox').innerHTML=`<h3>ยืนยันการสั่งซื้อ</h3><p style="margin:12px 0">${esc(p.name)}<br><span class="price">${money(p.price)} ฿</span></p>
 <p class="note">เครดิตคงเหลือ ${money(u.credit)} ฿</p>
 <div class="row"><button class="btn" id="mc">ยกเลิก</button><button class="btn pri" id="mo">ยืนยันซื้อ</button></div>`;
 $('#modal').classList.add('show');
 $('#mc').onclick=()=>$('#modal').classList.remove('show');
 $('#mo').onclick=()=>{
  $('#modal').classList.remove('show');
  if(u.credit<p.price)return toast('เครดิตไม่เพียงพอ กรุณาเติมเงิน');
  if(stock(p)<1)return toast('สินค้าหมด');
  u.credit-=p.price;S.stock[p.id]=stock(p)-1;S.sold++;
  const code=Array.from({length:3},()=>Math.random().toString(36).slice(2,7).toUpperCase()).join('-');
  S.orders.unshift({no:'ORD'+Date.now(),user:u.username,name:p.name,price:p.price,code,at:Date.now()});
  save();render();toast('ซื้อสำเร็จ! ดูโค้ดได้ที่หน้าประวัติ');
 };
}
const card=p=>{const n=stock(p),c=CATS.find(c=>c.id===p.cat);return `<div class="prod"><div class="pimg">${p.e}
 <span class="tag">${esc(c.name)}</span><span class="stk ${n?'':'out'}">${n?'พร้อมส่ง '+n+' ชิ้น':'สินค้าหมด'}</span></div>
 <div class="pbody"><h4>${esc(p.name)}</h4><p>${esc(p.desc)}</p><div class="pf"><span class="price">${money(p.price)} ฿</span>
 <button class="btn pri sm" ${n?'':'disabled'} onclick="buy(${p.id})">${n?'ซื้อสินค้า':'หมด'}</button></div></div></div>`};

/* ===== หน้าต่าง ๆ ===== */
let slideTimer,slideIdx=0;
function pageHome(){
 const members=S.users.length,inStock=PRODS.reduce((a,p)=>a+stock(p),0);
 setTimeout(()=>{clearInterval(slideTimer);const go=i=>{slideIdx=i;document.querySelectorAll('.slide').forEach((s,k)=>s.classList.toggle('on',k===i));document.querySelectorAll('.dots i').forEach((s,k)=>s.classList.toggle('on',k===i))};
  document.querySelectorAll('.dots i').forEach((d,i)=>d.onclick=()=>go(i));
  slideTimer=setInterval(()=>go((slideIdx+1)%SLIDES.length),5000);go(0)},0);
 return `<section class="slider">${SLIDES.map(s=>`<div class="slide ${s.c}" onclick="location.hash='${s.go}'"><h2>${s.t}</h2><p>${s.s}</p></div>`).join('')}
 <div class="dots">${SLIDES.map(()=>'<i></i>').join('')}</div></section>
 <section class="stats"><div class="stat"><strong>${members}</strong><span>จำนวนสมาชิกทั้งหมด</span></div>
 <div class="stat"><strong>${inStock}</strong><span>สินค้าและไอเทมพร้อมจำหน่าย</span></div>
 <div class="stat"><strong>${S.sold}</strong><span>สินค้าที่จำหน่ายไปแล้ว</span></div></section>
 <div class="sec"><h3>หมวดหมู่แนะนำ</h3><a class="btn sm" href="#categories">ดูทั้งหมด</a></div>
 <div class="grid">${CATS.map(c=>`<a class="cat" href="#categories/${c.id}"><div class="ico">${c.icon}</div><div><div>${esc(c.name)}</div>
 <small>${PRODS.filter(p=>p.cat===c.id).length} รายการ</small></div></a>`).join('')}</div>
 <div class="sec"><h3>สินค้าแนะนำ</h3><a class="btn sm" href="#categories">ดูสินค้าทั้งหมดในร้าน</a></div>
 <div class="grid">${PRODS.slice().sort((a,b)=>b.pop-a.pop).slice(0,4).map(card).join('')}</div>`;
}
function pageCats(id){
 id=+id||0;
 const c=CATS.find(x=>x.id===id);
 setTimeout(()=>{const q=$('#q'),so=$('#so');const draw=()=>{
   let l=PRODS.filter(p=>(!id||p.cat===id)&&p.name.toLowerCase().includes(q.value.trim().toLowerCase()));
   const s=so.value;l.sort(s==='pa'?(a,b)=>a.price-b.price:s==='pd'?(a,b)=>b.price-a.price:s==='pop'?(a,b)=>b.pop-a.pop:(a,b)=>b.id-a.id);
   $('#plist').innerHTML=l.length?l.map(card).join(''):'<div class="panel empty" style="grid-column:1/-1">ไม่พบรายการสินค้าที่ตรงกับเงื่อนไข<br>ลองเปลี่ยนคำค้นหา หรือเลือกหมวดหมู่อื่น</div>'};
  q.oninput=so.onchange=draw;draw()},0);
 return `<div class="panel"><h2>${c?esc(c.name):'หมวดหมู่และรายการสินค้าทั้งหมด'}</h2>
 <p style="color:var(--mut)">${c?esc(c.desc):'เลือกดูสินค้า ค้นหาไอเทม และเติมเงินเกมที่ต้องการ รับโค้ดทันที'}</p>
 <div class="row" style="margin-top:14px"><input id="q" placeholder="ค้นหาชื่อสินค้า..." aria-label="ค้นหา">
 <select id="so" aria-label="เรียงลำดับ"><option value="new">สินค้าใหม่ล่าสุด</option><option value="pa">ราคา: ต่ำ - สูง</option><option value="pd">ราคา: สูง - ต่ำ</option><option value="pop">สินค้ายอดนิยม</option></select></div>
 <div class="pills"><a class="pill ${id?'':'on'}" href="#categories">ทั้งหมด</a>${CATS.map(k=>`<a class="pill ${id===k.id?'on':''}" href="#categories/${k.id}">${k.icon} ${esc(k.name)} (${PRODS.filter(p=>p.cat===k.id).length})</a>`).join('')}</div></div>
 <div class="grid" id="plist"></div>`;
}
function pageTopup(){
 const u=me();
 if(!u)return `<div class="panel empty"><h3 style="color:var(--txt)">กรุณาเข้าสู่ระบบก่อนเติมเงิน</h3><p>ต้องมีบัญชีสมาชิกเพื่อบันทึกยอดเครดิต</p><p style="margin-top:14px"><a class="btn" href="#login">เข้าสู่ระบบ</a> <a class="btn pri" href="#register">สมัครสมาชิก</a></p></div>`;
 setTimeout(()=>{$('#tf').onsubmit=e=>{e.preventDefault();
  const v=$('#vu').value.trim(),up=v.toUpperCase();
  const used=S.topups.some(t=>t.code===v&&t.status==='success');
  let amt=0;
  if(up==='TEST100')amt=100;else if(up==='DEMO50')amt=50;
  const ok=amt>0&&!used;
  S.topups.unshift({no:'TOP'+Date.now(),user:u.username,code:v,amount:ok?amt:0,status:ok?'success':'failed',at:Date.now()});
  if(ok)u.credit+=amt;save();
  toast(ok?`เติมเครดิตสำเร็จ +${money(amt)} ฿`:used?'ซองนี้ถูกใช้ไปแล้ว':'ลิงก์ซองไม่ถูกต้อง');render()}},0);
 const mine=S.topups.filter(t=>t.user===u.username).slice(0,15);
 return `<div style="max-width:800px;margin:auto"><div class="panel"><small>ผู้ใช้งาน: <b>${esc(u.username)}</b></small>
 <div style="display:flex;justify-content:space-between;flex-wrap:wrap;align-items:baseline"><h3>เครดิตปัจจุบัน</h3><span class="price ok" style="font-size:30px">${money(u.credit)} ฿</span></div></div>
 <div class="panel"><div class="note" style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-style:solid">
 <span>เบอร์ TrueMoney Wallet ของร้าน: <b style="color:#fff;font-size:18px">${PHONE}</b></span><button class="btn sm" onclick="copy('${PHONE}')">คัดลอกเบอร์</button></div>
 <form id="tf"><label for="vu">วางลิงก์ซองของขวัญ TrueMoney Wallet *</label>
 <input id="vu" placeholder="https://gift.truemoney.com/campaign/?v=..." required autocomplete="off">
 <p class="note">โหมดทดสอบ: ลองกรอก <code>TEST100</code> หรือ <code>DEMO50</code> (ปิดโหมดนี้เมื่อเชื่อมระบบจริง)</p>
 <button class="btn pri" style="width:100%;padding:13px">ยืนยันการเติมเงิน</button></form></div>
 <div class="panel"><h4>วิธีสร้างซองของขวัญ</h4><ol style="margin:10px 0 0 20px;color:var(--mut)"><li>เปิดแอป TrueMoney แล้วเลือก "ส่งซองของขวัญ"</li><li>ใส่จำนวนเงิน แบ่งให้ 1 คน แล้วสร้างซอง</li><li>กด "คัดลอกลิงก์" แล้ววางในช่องด้านบน</li></ol></div>
 <div class="panel"><h4>ประวัติการเติมเครดิต (15 รายการล่าสุด)</h4>${topTable(mine)}</div></div>`;
}
function topTable(l){
 if(!l.length)return '<p class="empty">ยังไม่มีประวัติการเติมเครดิต</p>';
 return `<div class="tw"><table><tr><th>เลขที่รายการ</th><th>รหัสซอง</th><th>จำนวนเงิน</th><th>สถานะ</th><th>วัน-เวลา</th></tr>${l.map(t=>`<tr><td>${esc(t.no)}</td><td><code>${esc(t.code.slice(0,16))}</code></td>
 <td class="${t.status==='success'?'ok':'bad'}">${t.status==='success'?'+'+money(t.amount):'0.00'} ฿</td><td class="${t.status==='success'?'ok':'bad'}">${t.status==='success'?'สำเร็จ':'ไม่สำเร็จ'}</td><td>${thDate(t.at)}</td></tr>`).join('')}</table></div>`}
function pageHistory(tab){
 const u=me();if(!u){location.hash='login';return ''}
 const o=S.orders.filter(x=>x.user===u.username),t=S.topups.filter(x=>x.user===u.username);
 const ord=o.length?`<div class="tw"><table><tr><th>เลขที่คำสั่งซื้อ</th><th>สินค้า</th><th>ราคา</th><th>โค้ดที่ได้รับ</th><th>สถานะ</th><th>วัน-เวลา</th><th></th></tr>${o.map(x=>`<tr><td><code>${esc(x.no)}</code></td><td>${esc(x.name)}</td><td class="price" style="font-size:15px">${money(x.price)} ฿</td><td><code>${esc(x.code)}</code></td><td class="ok">สำเร็จ</td><td>${thDate(x.at)}</td><td><button class="btn sm" onclick="copy('${esc(x.code)}')">คัดลอก</button></td></tr>`).join('')}</table></div>`
  :'<div class="empty"><h3 style="color:var(--txt)">ยังไม่มีประวัติการซื้อสินค้า</h3><p style="margin:8px 0 16px">เริ่มเลือกซื้อไอเทมเกมได้ทันที</p><a class="btn pri" href="#categories">ไปหน้ารายการสินค้า</a></div>';
 return `<div class="sec" style="margin-top:0"><h3>ประวัติการทำรายการ</h3><a class="btn sm" href="#categories">เลือกซื้อสินค้าเพิ่ม</a></div>
 <div class="pills" style="margin:0 0 16px"><a class="pill ${tab==='topups'?'':'on'}" href="#history">ประวัติการซื้อสินค้า (${o.length})</a><a class="pill ${tab==='topups'?'on':''}" href="#history/topups">ประวัติการเติมเครดิต (${t.length})</a></div>
 <div class="panel">${tab==='topups'?topTable(t):ord}</div>`;
}
function pageLogin(){
 if(me()){location.hash='home';return ''}
 setTimeout(()=>{$('#lf').onsubmit=e=>{e.preventDefault();
  const n=$('#lu').value.trim().toLowerCase(),p=$('#lp').value;
  const u=S.users.find(x=>(x.username.toLowerCase()===n||x.email.toLowerCase()===n)&&x.password===p);
  if(!u)return toast('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
  S.me=u.username;save();toast('เข้าสู่ระบบสำเร็จ');location.hash='home'}},0);
 return `<div class="panel narrow"><h2>เข้าสู่ระบบ</h2><p style="color:var(--mut)">กรอกข้อมูลเพื่อเข้าสู่ระบบ</p>
 <form id="lf"><label for="lu">ชื่อผู้ใช้งาน หรือ อีเมล</label><input id="lu" required autocomplete="username">
 <label for="lp">รหัสผ่าน</label><input id="lp" type="password" required autocomplete="current-password">
 <button class="btn pri" style="width:100%;margin:20px 0 12px;padding:12px">เข้าสู่ระบบ</button></form>
 <p style="text-align:center;color:var(--mut)">ยังไม่มีบัญชี? <a href="#register" style="color:var(--red)">สมัครสมาชิก</a></p>
 <p class="note">บัญชีทดสอบ (ลบออกก่อนขึ้นระบบจริง): <code>admin</code>/<code>admin123</code> · <code>user</code>/<code>user123</code></p></div>`;
}
function pageReg(){
 if(me()){location.hash='home';return ''}
 setTimeout(()=>{$('#rf').onsubmit=e=>{e.preventDefault();
  const n=$('#ru').value.trim(),m=$('#re').value.trim(),p=$('#rp').value;
  if(!/^[A-Za-z0-9_]{3,30}$/.test(n))return toast('ชื่อผู้ใช้ต้องเป็นอังกฤษหรือตัวเลข 3-30 ตัว');
  if(p.length<6)return toast('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร');
  if(p!==$('#rc').value)return toast('รหัสผ่านไม่ตรงกัน');
  if(S.users.some(x=>x.username.toLowerCase()===n.toLowerCase()||x.email.toLowerCase()===m.toLowerCase()))return toast('ชื่อผู้ใช้หรืออีเมลนี้ถูกใช้แล้ว');
  S.users.push({username:n,email:m,password:p,credit:0});S.me=n;save();toast('สมัครสมาชิกสำเร็จ');location.hash='home'}},0);
 return `<div class="panel narrow"><h2>สร้างบัญชี KhontaiShop</h2><p style="color:var(--mut)">สมัครสมาชิกเพื่อเริ่มสั่งซื้อไอเทมเกมและโค้ดเติมเงิน</p>
 <form id="rf"><label for="ru">ชื่อผู้ใช้งาน *</label><input id="ru" placeholder="ภาษาอังกฤษหรือตัวเลข 3-30 ตัว" required autocomplete="username">
 <label for="re">อีเมล *</label><input id="re" type="email" required autocomplete="email">
 <div class="row"><div><label for="rp">รหัสผ่าน *</label><input id="rp" type="password" placeholder="อย่างน้อย 6 ตัว" required autocomplete="new-password"></div>
 <div><label for="rc">ยืนยันรหัสผ่าน *</label><input id="rc" type="password" required autocomplete="new-password"></div></div>
 <button class="btn pri" style="width:100%;margin:20px 0 12px;padding:12px">ยืนยันการสมัครสมาชิก</button></form>
 <p style="text-align:center;color:var(--mut)">มีบัญชีแล้ว? <a href="#login" style="color:var(--red)">เข้าสู่ระบบ</a></p></div>`;
}

/* ===== Router ===== */
function render(){
 const [pg='home',arg]=location.hash.slice(1).split('/');
 const u=me();
 $('#nav').innerHTML=[['home','หน้าหลัก'],['categories','สินค้า'],['topup','เติมเงิน']].map(([h,t])=>`<a href="#${h}" class="${pg===h?'on':''}">${t}</a>`).join('')
 +(u?`<a href="#history" class="${pg==='history'?'on':''}">ประวัติ</a><a class="on" style="color:var(--ok)" href="#topup">${esc(u.username)} · ${money(u.credit)} ฿</a><a onclick="S.me=null;save();location.hash='home';render()">ออกจากระบบ</a>`
 :`<a href="#login" class="${pg==='login'?'on':''}">เข้าสู่ระบบ</a><a class="btn pri sm" href="#register" style="color:#fff">สมัครสมาชิก</a>`);
 clearInterval(slideTimer);
 const P={home:pageHome,categories:()=>pageCats(arg),topup:pageTopup,history:()=>pageHistory(arg),login:pageLogin,register:pageReg};
 $('#app').innerHTML=(P[pg]||pageHome)();
 window.scrollTo(0,0);
}
addEventListener('hashchange',render);render();
</script>
</body>
</html>
